        // ========== 工具函数 ==========
        function toMin(t) {
            if (!t || t === '—') return null;
            var p = t.split(':');
            var m = parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
            if (isNaN(m)) return null;
            if (m < 240) m += 1440;
            return m;
        }
        function fmtHHMM(t) {
            if (!t || t === '—') return null;
            var p = t.split(':');
            return (p[0] || '00').padStart(2, '0') + ':' + (p[1] || '00').padStart(2, '0');
        }
        function fmtStartTime(obj) {
            if (!obj) return '—';
            var f = obj.first && obj.first !== '—' ? fmtHHMM(obj.first) : null;
            var l = obj.last  && obj.last  !== '—' ? fmtHHMM(obj.last)  : null;
            if (f && l) return f + ' / ' + l;
            if (l) return l;
            if (f) return f;
            return '—';
        }

        function buildDirection(stations, reverse) {
            var n = stations.length;
            var wdCum = new Array(n).fill(0);
            var hdCum = new Array(n).fill(0);

            for (var i = 1; i < n; i++) {
                var wdCur = toMin(stations[i].workday.last);
                var wdPrev = toMin(stations[i-1].workday.last);
                var wdSeg = (wdCur !== null && wdPrev !== null) ? wdCur - wdPrev : 0;
                if (wdSeg < 0) wdSeg += 1440;
                wdCum[i] = wdCum[i-1] + wdSeg;

                var hdCur = toMin(stations[i].holiday.last);
                var hdPrev = toMin(stations[i-1].holiday.last);
                var hdSeg = (hdCur !== null && hdPrev !== null) ? hdCur - hdPrev : 0;
                if (hdSeg < 0) hdSeg += 1440;
                hdCum[i] = hdCum[i-1] + hdSeg;
            }
            var wdTotal = wdCum[n-1];
            var hdTotal = hdCum[n-1];

            var arr, wdArr, hdArr;
            if (reverse) {
                arr = stations.slice().reverse();
                wdArr = wdCum.slice().reverse().map(function(c) { return wdTotal - c; });
                hdArr = hdCum.slice().reverse().map(function(c) { return hdTotal - c; });
            } else {
                arr = stations;
                wdArr = wdCum;
                hdArr = hdCum;
            }

            var result = [];
            for (var j = 0; j < arr.length; j++) {
                var s = arr[j];
                if (j === 0) {
                    result.push({
                        name: s.name,
                        workday: fmtStartTime(s.workday),
                        holiday: fmtStartTime(s.holiday),
                        isStart: true
                    });
                } else {
                    var seg = wdArr[j] - wdArr[j-1];
                    var cum = wdArr[j];
                    result.push({
                        name: s.name,
                        workday: '',
                        holiday: '+' + seg + '/+' + cum,
                        isStart: false
                    });
                }
            }
            return result;
        }

        // ========== DOM ==========
        var citySelect = document.getElementById('citySelect');
        var lineSelect = document.getElementById('lineSelect');
        var upHeader   = document.getElementById('upHeader');
        var downHeader = document.getElementById('downHeader');
        var tableBody  = document.getElementById('tableBody');

        function init() {
            Object.keys(metroDatabase).forEach(function(key) {
                var opt = document.createElement('option');
                opt.value = key;
                opt.textContent = metroDatabase[key].name;
                citySelect.appendChild(opt);
            });
            citySelect.value = 'beijing';
            updateLines();
            citySelect.addEventListener('change', updateLines);
            lineSelect.addEventListener('change', render);
        }

        function updateLines() {
            var cityKey = citySelect.value;
            var city = metroDatabase[cityKey];
            lineSelect.innerHTML = '';
            if (!city || !city.lines || city.lines.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="color:#94a3b8;padding:40px;">该城市线路数据暂未收录</td></tr>';
                upHeader.textContent = '上行';
                downHeader.textContent = '下行';
                return;
            }
            city.lines.forEach(function(l) {
                var opt = document.createElement('option');
                opt.value = l.id;
                opt.textContent = l.name;
                lineSelect.appendChild(opt);
            });
            render();
        }

        function render() {
            var cityKey = citySelect.value;
            var lineId = lineSelect.value;
            var city = metroDatabase[cityKey];
            if (!city || !city.lines) return;
            var line = city.lines.find(function(l) { return l.id === lineId; });
            if (!line || !line.stations || line.stations.length < 2) {
                tableBody.innerHTML = '<tr><td colspan="6" style="color:#94a3b8;padding:40px;">该线路数据暂未收录</td></tr>';
                upHeader.textContent = '上行';
                downHeader.textContent = '下行';
                return;
            }

            var upData = buildDirection(line.stations, false);
            var downData = buildDirection(line.stations, true);
            var upFrom = line.stations[0].name;
            var upTo = line.stations[line.stations.length - 1].name;

            upHeader.textContent = '上行（' + upFrom + ' → ' + upTo + '）';
            downHeader.textContent = '下行（' + upTo + ' → ' + upFrom + '）';

            var maxRows = Math.max(upData.length, downData.length);
            tableBody.innerHTML = '';
            for (var i = 0; i < maxRows; i++) {
                var up = upData[i] || { name: '', workday: '', holiday: '', isStart: false };
                var down = downData[i] || { name: '', workday: '', holiday: '', isStart: false };
                var tr = document.createElement('tr');
                if (up.isStart) {
                    tr.innerHTML = '<td>' + up.name + '</td>' +
                        '<td class="start-cell">' + (up.workday || '') + '</td>' +
                        '<td class="start-cell">' + (up.holiday || '') + '</td>' +
                        '<td class="divider">' + down.name + '</td>' +
                        '<td class="start-cell">' + (down.workday || '') + '</td>' +
                        '<td class="start-cell">' + (down.holiday || '') + '</td>';
                } else {
                    tr.innerHTML = '<td>' + up.name + '</td>' +
                        '<td colspan="2" class="diff-cell">' + (up.holiday || '') + '</td>' +
                        '<td class="divider">' + down.name + '</td>' +
                        '<td colspan="2" class="diff-cell">' + (down.holiday || '') + '</td>';
                }
                tableBody.appendChild(tr);
            }
        }

        init();
    </script>
